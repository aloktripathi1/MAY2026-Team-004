name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          direct_prompt: |
            Review this pull request as a thorough code reviewer. For the changed files, check:

            1. **Bugs** - logic errors, incorrect conditionals, off-by-one errors, null/undefined
               handling, race conditions, and edge cases that aren't handled.
            2. **Issues** - security vulnerabilities, broken error handling, resource leaks,
               and anything that could cause the code to misbehave in production.
            3. **Code quality** - readability, naming, duplication, overly complex logic,
               inconsistent style with the rest of the codebase.
            4. **Improvements** - concrete, actionable suggestions to fix or simplify the above.
               Prefer specific line-level suggestions over general remarks.

            Post inline comments on the specific lines where issues are found, and end with a
            short summary comment covering the overall assessment. Do not comment on lines that
            look fine just to fill space - only flag real findings.
