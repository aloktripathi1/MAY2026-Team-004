openapi: 3.0.3
info:
  title: Sangam API
  version: 0.1.0
  description: |
    Sangam club platform APIs (IITM BS).

    APIs created (own): listed under paths below.
    APIs integrated (third-party): none in this file yet.

    GenAI APIs: POST /api/assistant/query (Ask Sangam Q&A + task proposals),
    POST /api/assistant/confirm (accept/reject proposed task actions), listed
    under the GenAI tag and kept separate from the non-GenAI endpoints above.

    User story mapping: each operation includes `x-user-story` matching
    docs/user_stories.md and docs/Sangam_M3_M4_Plan.md.

    Try it out:
    - Preferred: open http://localhost:3000/api-docs (same-origin Swagger UI).
    - Spec URL: http://localhost:3000/api/openapi
    - editor.swagger.io cannot reliably call http://localhost from HTTPS
      (browser mixed-content block). CORS is enabled for that origin when
      the browser allows the request (e.g. a local Swagger Editor).
  contact:
    name: MAY2026-Team-004

servers:
  - url: /
    description: Same origin (local /api-docs or deployed /api-docs)
  - url: http://localhost:3000
    description: Local absolute URL (curl, external tools)
  - url: https://try-sangam.vercel.app
    description: Production absolute URL (curl, external tools)

tags:
  - name: Auth
    description: Account creation and session (User Story 1.1)
  - name: Membership
    description: Club member directory, join requests, status, bulk import, interests (Epic 1, Story 7.1)
  - name: Events
    description: Event creation, listing, registration, check-in, approval, locking (Epic 2)
  - name: Mock Auth
    description: Demo stub only. Not part of the real auth REST surface.
  - name: GenAI
    description: |
      GenAI endpoints, kept separate from the regular CRUD APIs above.
      Structured retrieval-and-generation over Postgres (classify intent ->
      scoped Prisma query -> generate grounded answer), not vector RAG.
      Task mutations use an in-process tool agent with user Accept/Reject.

paths:
  /api/auth/signup:
    post:
      tags:
        - Auth
      summary: Create account with institutional credentials
      description: |
        Creates a student account with institutional email, name, roll number,
        and password. Only emails ending with @ds.study.iitm.ac.in are accepted.

        On success, sets httpOnly session cookies and returns the created user
        (password is never returned). Client should continue to onboarding.

        User Story 1.1 - Institutional Credential Verification
        As a Club Admin, I want to verify student membership using institutional
        credentials, so that only eligible students can join the club.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - POST /api/auth/signup
      operationId: authSignup
      x-user-story: "1.1"
      x-user-story-title: Institutional Credential Verification
      x-plan-endpoint: POST /api/auth/signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
            examples:
              valid:
                summary: Valid institutional signup
                value:
                  name: Ananya Rao
                  email: 23s1000999@ds.study.iitm.ac.in
                  rollNumber: "23s1000999"
                  password: SecurePass1
              nonInstitutional:
                summary: Rejected - wrong email domain
                value:
                  name: Outside User
                  email: student@gmail.com
                  rollNumber: "23s1000888"
                  password: SecurePass1
      responses:
        "201":
          description: Account created. Session cookies set.
          headers:
            Set-Cookie:
              description: httpOnly signed session cookie (sangam_session)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupSuccessResponse"
              example:
                success: true
                data:
                  id: clxexampleid
                  name: Ananya Rao
                  email: 23s1000999@ds.study.iitm.ac.in
                  rollNumber: "23s1000999"
                  next: /signup/onboarding
                userStory: "1.1"
        "400":
          description: |
            Invalid JSON body, or Zod validation failure
            (including non-institutional email, short password, missing fields).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  summary: Non-institutional email
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Email must end with @ds.study.iitm.ac.in
                      details:
                        - path: email
                          message: Email must end with @ds.study.iitm.ac.in
                    userStory: "1.1"
                invalidJson:
                  summary: Malformed body
                  value:
                    success: false
                    error:
                      code: INVALID_JSON
                      message: Request body must be valid JSON.
                    userStory: "1.1"
        "409":
          description: Email or roll number already registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                emailExists:
                  summary: Duplicate email
                  value:
                    success: false
                    error:
                      code: EMAIL_EXISTS
                      message: An account with this email already exists.
                    userStory: "1.1"
                rollExists:
                  summary: Duplicate roll number
                  value:
                    success: false
                    error:
                      code: ROLL_EXISTS
                      message: An account with this roll number already exists.
                    userStory: "1.1"
        "500":
          description: Unexpected server failure while creating the account.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: Could not create account. Please try again.
                userStory: "1.1"

  /api/auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate and return session
      description: |
        Authenticates with institutional email and password. On success, sets
        httpOnly session cookies and returns the user, memberships/roles, and
        a safe post-login path.

        Only emails ending with @ds.study.iitm.ac.in are accepted. Failed auth
        returns a generic INVALID_CREDENTIALS message (401) so responses do not
        reveal whether the email or password was wrong. Optional callbackUrl is
        accepted only when it is a same-origin relative path (starts with `/`,
        not `//`). Mock/demo auth remains separate under /api/auth/{nextauth}.

        User Story 1.1 - Institutional Credential Verification
        As a Club Admin, I want to verify student membership using institutional
        credentials, so that only eligible students can join the club.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - POST /api/auth/login
      operationId: authLogin
      x-user-story: "1.1"
      x-user-story-title: Institutional Credential Verification
      x-plan-endpoint: POST /api/auth/login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              valid:
                summary: Valid institutional login
                value:
                  email: 23s1000123@ds.study.iitm.ac.in
                  password: sangam
              withCallback:
                summary: Login with safe callbackUrl
                value:
                  email: 23s1000123@ds.study.iitm.ac.in
                  password: sangam
                  callbackUrl: /app/profile
              nonInstitutional:
                summary: Rejected - wrong email domain
                value:
                  email: student@gmail.com
                  password: sangam
      responses:
        "200":
          description: Authenticated. Session cookies set.
          headers:
            Set-Cookie:
              description: httpOnly signed session cookie (sangam_session)
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginSuccessResponse"
              example:
                success: true
                data:
                  id: u1
                  name: Ananya Rao
                  email: 23s1000123@ds.study.iitm.ac.in
                  rollNumber: "23s1000123"
                  isFaculty: true
                  memberships:
                    - clubId: c1
                      clubSlug: tech
                      clubName: Tech Club
                      role: Admin
                      personaName: Ananya Rao
                  next: /faculty
                userStory: "1.1"
        "400":
          description: Invalid JSON or Zod validation failure (including non-institutional email).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                validation:
                  summary: Non-institutional email
                  value:
                    success: false
                    error:
                      code: VALIDATION_ERROR
                      message: Email must end with @ds.study.iitm.ac.in
                      details:
                        - path: email
                          message: Email must end with @ds.study.iitm.ac.in
                    userStory: "1.1"
                invalidJson:
                  summary: Malformed body
                  value:
                    success: false
                    error:
                      code: INVALID_JSON
                      message: Request body must be valid JSON.
                    userStory: "1.1"
        "401":
          description: Email/password do not match an account (generic message).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INVALID_CREDENTIALS
                  message: Invalid email or password.
                userStory: "1.1"
        "500":
          description: Unexpected server failure while signing in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: Could not sign in. Please try again.
                userStory: "1.1"

  /api/auth/me:
    get:
      tags:
        - Auth
      summary: Return current user and held roles/memberships
      description: |
        Returns the authenticated user from real session cookies, with fresh
        memberships and roles loaded from the database (not from stale cookie
        copies alone). Also returns accessible app roles (multi-role) and the
        default home path.

        Requires a prior successful POST /api/auth/signup or POST /api/auth/login
        that set httpOnly cookies. Does NOT fall back to the mock demo persona
        used by lib/mock-session.ts — unauthenticated requests get 401.

        User Story 1.1 - Institutional Credential Verification (session identity)
        Multi-role: returns all club memberships and accessibleAppRoles.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - GET /api/auth/me
      operationId: authMe
      x-user-story: "1.1"
      x-user-story-title: Institutional Credential Verification
      x-plan-endpoint: GET /api/auth/me
      x-multi-role: true
      security:
        - SangamSessionCookie: []
      responses:
        "200":
          description: Current user with memberships and accessible roles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeSuccessResponse"
              example:
                success: true
                data:
                  id: u1
                  name: Ananya Rao
                  email: 23s1000123@ds.study.iitm.ac.in
                  rollNumber: "23s1000123"
                  isFaculty: true
                  memberships:
                    - clubId: c1
                      clubSlug: codechef
                      clubName: CodeChef IITM BS
                      role: Admin
                      personaName: Ananya Rao
                  roles:
                    - faculty
                    - admin
                    - member
                  home: /faculty
                userStory: "1.1"
        "401":
          description: Missing or invalid session cookies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: Authentication required.
                userStory: "1.1"
        "500":
          description: Unexpected server failure while loading the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: INTERNAL_ERROR
                  message: Could not load current user. Please try again.
                userStory: "1.1"

  /api/auth/logout:
    post:
      tags:
        - Auth
      summary: Clear the session cookie
      description: |
        Clears the signed sangam_session cookie. There is no separate
        bearer/access token in Sangam and no server-side session store — the
        cookie IS the credential, so clearing it is the entire logout. A raw
        copy of the cookie value made before logout would still verify (it's
        a stateless HMAC signature, not a revocable server-side record); if
        that threat matters for your deployment, move to a server-side
        session store with revocation instead. Always returns 200, even if
        no session was present.

        User Story 1.1 - Institutional Credential Verification (session teardown)
      operationId: authLogout
      x-user-story: "1.1"
      x-user-story-title: Institutional Credential Verification
      responses:
        "200":
          description: Session cookie cleared
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: object
                    properties:
                      loggedOut:
                        type: boolean
                  userStory:
                    type: string
              example:
                success: true
                data:
                  loggedOut: true
                userStory: "1.1"

  /api/auth/{nextauth}:
    parameters:
      - name: nextauth
        in: path
        required: true
        description: Catch-all path segments for the mock NextAuth stub
        schema:
          type: string
    get:
      tags:
        - Mock Auth
      summary: Mock NextAuth catch-all (GET)
      description: |
        Mock stub only. Returns mode mock. Not used for real signup, login, or me.
        Kept so existing demo paths are not broken. Real auth uses explicit
        REST routes such as POST /api/auth/signup, POST /api/auth/login, and GET /api/auth/me.
      operationId: mockAuthGet
      x-user-story: "n/a"
      x-mock: true
      responses:
        "200":
          description: Mock mode acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockAuthResponse"
              example:
                mode: mock
                message: Mock auth stub. Use /api/auth/signup (and other REST auth routes) for real auth.
    post:
      tags:
        - Mock Auth
      summary: Mock NextAuth catch-all (POST)
      description: Mock stub only. Separate from real REST auth routes (/signup, /login, /me).
      operationId: mockAuthPost
      x-user-story: "n/a"
      x-mock: true
      responses:
        "200":
          description: Mock mode acknowledgement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MockAuthResponse"

  /api/onboarding/interests:
    post:
      tags:
        - Membership
      summary: Save selected interest tags after signup
      description: |
        Saves the interest tags the user selected during onboarding, used later
        for interest-based club discovery.

        User Story 7.1 - Interest-Based Club Discovery
        As a Club Member, I want to specify my interests during profile creation
        and discover clubs that match them, so that I can join communities that
        are genuinely relevant to me instead of joining randomly through a shared link.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - POST /api/onboarding/interests
      operationId: saveOnboardingInterests
      x-user-story: "7.1"
      x-user-story-title: Interest-Based Club Discovery
      security:
        - SangamSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnboardingInterestsRequest"
            examples:
              valid:
                summary: Two interests selected
                value:
                  interests: ["Technical", "Design"]
      responses:
        "200":
          description: Interests saved.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      interests:
                        type: array
                        items: { type: string }
                  userStory: { type: string, example: "7.1" }
        "400":
          description: Zero or too many interests selected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure while saving interests.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/members/bulk-import:
    post:
      tags:
        - Membership
      summary: Bulk-import existing member lists
      description: |
        Imports a list of members (name, roll number, email, optional role) into
        a club in one call, upserting users by roll number and skipping rows that
        already have a membership in the club.

        User Story 1.5 - Bulk Member Import
        As a Club Admin, I want to bulk-import existing member lists from
        spreadsheets or Google Forms, so that I am not forced to manually
        re-register every existing member when onboarding the club onto the platform.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - POST /api/members/bulk-import
      operationId: bulkImportMembers
      x-user-story: "1.5"
      x-user-story-title: Bulk Member Import
      security:
        - SangamSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportRequest"
      responses:
        "200":
          description: Import processed. Returns counts, not per-row errors.
          content:
            application/json:
              schema:
                type: object
                required: [success, data]
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      imported: { type: integer, example: 8 }
                      skipped: { type: integer, example: 2 }
                  userStory: { type: string, example: "1.5" }
        "400":
          description: Missing clubId or empty rows array.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Admin of the target club.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure while importing members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/clubs/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        description: Club id
        schema: { type: string }
    get:
      tags:
        - Membership
      summary: List members of a club (admin view)
      description: |
        Returns every membership row for the club, including each member's
        role and status.

        User Story 1.2 - Centralized Member Directory
        As a Club Admin, I want to maintain a centralized directory of all club
        members, so that I can track member information without relying on
        multiple Google Forms and spreadsheets.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - GET /api/clubs/[id]/members
      operationId: listClubMembers
      x-user-story: "1.2"
      x-user-story-title: Centralized Member Directory
      security:
        - SangamSessionCookie: []
      responses:
        "200":
          description: Member list for the club.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      members:
                        type: array
                        items:
                          $ref: "#/components/schemas/MembershipRecord"
                  userStory: { type: string, example: "1.2" }
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Admin of this club.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure while loading members.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
        - Membership
      summary: Register/apply to join a club
      description: |
        Creates a Pending membership for the current user in this club.

        User Story 1.3 - Single-Portal Registration
        As a Club Member, I want to register for a club through a single portal,
        so that I do not miss registration updates or have to fill duplicate forms.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - POST /api/clubs/[id]/members
      operationId: applyToJoinClub
      x-user-story: "1.3"
      x-user-story-title: Single-Portal Registration
      security:
        - SangamSessionCookie: []
      responses:
        "201":
          description: Join request created with Pending status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      membership:
                        $ref: "#/components/schemas/MembershipRecord"
                  userStory: { type: string, example: "1.3" }
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Club not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already a member of, or already applied to, this club.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                success: false
                error:
                  code: ALREADY_MEMBER
                  message: Already a member of, or already applied to, this club.
                userStory: "1.3"
        "500":
          description: Unexpected server failure while submitting the join request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/clubs/{id}/members/{memberId}:
    parameters:
      - name: id
        in: path
        required: true
        description: Club id
        schema: { type: string }
      - name: memberId
        in: path
        required: true
        description: Membership id
        schema: { type: string }
    patch:
      tags:
        - Membership
      summary: Approve/reject/update membership status
      description: |
        Updates a membership's status (Active/Pending/Inactive). Requires the
        caller to be an Admin of the membership's club.

        User Story 1.4 - Membership Status Tracking
        As a Club Member, I want to view my membership status after logging
        into the platform, so that I know whether my application has been
        approved or is still under review.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Auth and Membership - PATCH /api/clubs/[id]/members/[memberId]
      operationId: updateMembershipStatus
      x-user-story: "1.4"
      x-user-story-title: Membership Status Tracking
      security:
        - SangamSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Active, Pending, Inactive]
            examples:
              approve:
                summary: Approve a pending application
                value: { status: Active }
      responses:
        "200":
          description: Membership status updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      membership:
                        $ref: "#/components/schemas/MembershipRecord"
                  userStory: { type: string, example: "1.4" }
        "400":
          description: Invalid status value.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Caller is not an Admin of this club.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Membership not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Unexpected server failure while updating membership status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/events:
    get:
      tags:
        - Events
      summary: List events, filterable by club/status
      description: |
        Returns events, optionally filtered by `clubId` and/or `status`
        (upcoming/live/past).

        User Story 2.5 - Event Listing Page
        As a Club Member, I want to access details of upcoming and past events
        in one place, so that I can easily stay informed about club activities.

        Plan ref: docs/Sangam_M3_M4_Plan.md - Event Management - GET /api/events
      operationId: listEvents
      x-user-story: "2.5"
      x-user-story-title: Event Listing Page
      parameters:
        - name: clubId
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [upcoming, live, past] }
      responses:
        "200":
          description: List of events (with club embedded).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      events:
                        type: array
                        items:
                          $ref: "#/components/schemas/EventRecord"
                  userStory: { type: string, example: "2.5" }
        "500":
