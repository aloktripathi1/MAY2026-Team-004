  # --- GenAI APIs ---------------------------------------------------------
  # Kept separate from the regular CRUD endpoints above. Ask Sangam is
  # structured retrieval-and-generation over Postgres, not vector RAG: one
  # Claude call classifies intent + entities (backend/domain/assistant.ts),
  # a normal Prisma query runs scoped to the caller's own session
  # (memberships / userId — never another club's or user's data), and a
  # second Claude call turns the query result into a short natural-language
  # answer using only that data. If the query finds nothing, the fixed
  # "I don't have that information." response is returned and the
  # generation call is skipped entirely, so Claude can never improvise an
  # answer from empty data. Task mutations use a dual path: classify as
  # task_action, then an in-process tool agent proposes writes that the
  # user must Accept via POST /api/assistant/confirm. See lib/genai.ts.
  /api/assistant/query:
    post:
      tags:
        - GenAI
      summary: Ask Sangam — natural-language Q&A grounded in live app data
      description: |
        Answers a plain-English question about the caller's own events,
        tasks, announcements, or club memberships. Every answer is grounded
        in a real database record for the authenticated session — never a
        model guess and never another user's or club's data.

        When the user asks to change a task (status update or assign), the
        response may include `proposedAction` with a signed token. No write
        is applied until POST /api/assistant/confirm with decision=accept.

        Issue #116 - Ask Sangam: natural-language Q&A assistant grounded in
        live app data.
      operationId: assistantQuery
      x-user-story: "Ask Sangam"
      security:
        - SangamSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  minLength: 1
                  maxLength: 500
                  example: "When's my next event?"
                role:
                  type: string
                  enum: [member, coordinator, admin, volunteer, faculty]
                  description: |
                    Dashboard the question was asked from. Task tools are scoped
                    to it, so a coordinator asking from the member app gets member
                    capabilities. Ignored unless the session actually holds the role.
      responses:
        "200":
          description: Answer generated (or the fixed no-data response if nothing matched).
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      answer:
                        type: string
                        example: Your next event is "Winter Debate Open" on Wed, Aug 5 at 8:00 PM, Amphitheatre (Paradox - Debate Society).
                      sourceType:
                        type: string
                        nullable: true
                        enum: [event, task, announcement, membership, null]
                      sourceLabel:
                        type: string
                        nullable: true
                      sourceHref:
                        type: string
                        nullable: true
                      proposedAction:
                        type: object
                        nullable: true
                        description: Present when a task write needs user confirmation.
                        properties:
                          toolName: { type: string, example: update_task_status }
                          summary: { type: string, example: Mark task "Poster design" as done. }
                          argsPreview:
                            type: object
                            additionalProperties: { type: string }
                          token: { type: string, description: Signed pending-action token }
                          status: { type: string, enum: [pending] }
                  userStory: { type: string, example: "Ask Sangam" }
        "400":
          description: Missing or invalid query.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: |
            Unexpected server failure, including Claude API errors or
            timeouts during classification or generation — the caller always
            gets a graceful fallback message via the 200 response's `answer`
            field for those cases, not a raw provider error; this 500 is
            reserved for failures outside that path (e.g. the database
            itself being unreachable).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /api/assistant/confirm:
    post:
      tags:
        - GenAI
      summary: Accept or reject a proposed Ask Sangam task action
      description: |
        Confirms or cancels a pending write proposed by POST /api/assistant/query
        (task_action path). Accept runs the domain mutation with the session
        actor; reject returns a fixed refusal and invalidates the token.
      operationId: assistantConfirm
      x-user-story: "Ask Sangam"
      security:
        - SangamSessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, token]
              properties:
                decision:
                  type: string
                  enum: [accept, reject]
                token:
                  type: string
                  description: Signed token from proposedAction.token
      responses:
        "200":
          description: Action accepted (DB updated) or rejected.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      answer: { type: string }
                      sourceType:
                        type: string
                        nullable: true
                        enum: [event, task, announcement, membership, null]
                      sourceLabel: { type: string, nullable: true }
                      sourceHref: { type: string, nullable: true }
                  userStory: { type: string, example: "Ask Sangam" }
        "400":
          description: Invalid/expired/consumed token or action failed authz/validation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Missing or invalid session cookies.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    SangamSessionCookie:
      type: apiKey
      in: cookie
      name: sangam_session
      description: |
        Session established by POST /api/auth/signup or POST /api/auth/login.
        A single httpOnly cookie holding an HMAC-signed userId — name, email,
        role, and memberships are never stored client-side and are always
        loaded fresh from the database per request. There is no separate
        bearer/access token: this cookie is the only credential, and
        POST /api/auth/logout clears it. See backend/auth/session-cookies.ts.

  schemas:
    SignupRequest:
      type: object
      required:
        - name
        - email
        - rollNumber
        - password
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          description: Full name of the student
          example: Ananya Rao
        email:
          type: string
          format: email
          description: |
            Institutional email only. Must end with @ds.study.iitm.ac.in.
            Case-insensitive input; stored lowercase.
          pattern: "^[^@\\s]+@ds\\.study\\.iitm\\.ac\\.in$"
          example: 23s1000999@ds.study.iitm.ac.in
        rollNumber:
          type: string
          minLength: 1
          description: Unique institutional roll number
          example: "23s1000999"
        password:
          type: string
          format: password
          minLength: 8
          description: Account password (minimum 8 characters)
          example: SecurePass1

    LoginRequest:
      type: object
      required:
        - email
        - password
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          description: Institutional email only. Must end with @ds.study.iitm.ac.in.
          pattern: "^[^@\\s]+@ds\\.study\\.iitm\\.ac\\.in$"
          example: 23s1000123@ds.study.iitm.ac.in
        password:
          type: string
          format: password
          minLength: 1
          description: Account password
          example: sangam
        callbackUrl:
          type: string
          description: |
            Optional post-login path. Only same-origin relative paths are honored
            (must start with `/` and must not start with `//`). Unsafe values fall
            back to the role-based home path.
          example: /app/profile

    SessionMembership:
      type: object
      required:
        - clubId
        - clubSlug
        - clubName
        - role
        - personaName
      properties:
        clubId:
          type: string
        clubSlug:
          type: string
        clubName:
          type: string
        role:
          type: string
          description: Club role (Member, Volunteer, Coordinator, Admin)
          example: Admin
        personaName:
          type: string

    LoginUser:
      type: object
      required:
        - id
        - name
        - email
        - isFaculty
        - memberships
        - next
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        rollNumber:
          type: string
          nullable: true
        isFaculty:
          type: boolean
        memberships:
          type: array
          items:
            $ref: "#/components/schemas/SessionMembership"
        next:
          type: string
          description: Safe post-login path (callbackUrl or role home)
          example: /faculty

    LoginSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/LoginUser"
        userStory:
          type: string
          example: "1.1"

    MeUser:
      type: object
      required:
        - id
        - name
        - email
        - isFaculty
        - memberships
        - roles
        - home
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        rollNumber:
          type: string
          nullable: true
        isFaculty:
          type: boolean
        memberships:
          type: array
          description: All club memberships held by the user (multi-role / multi-club)
          items:
            $ref: "#/components/schemas/SessionMembership"
        roles:
          type: array
          description: App shells the user can open (faculty, admin, coordinator, volunteer, member)
          items:
            type: string
            enum:
              - faculty
              - admin
              - coordinator
              - volunteer
              - member
        home:
          type: string
          description: Default home path for the highest role
          example: /faculty

    MeSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/MeUser"
        userStory:
          type: string
          example: "1.1"

    SignupUser:
      type: object
      required:
        - id
        - name
        - email
        - rollNumber
        - next
      properties:
        id:
          type: string
          description: Created user id (cuid)
        name:
          type: string
        email:
          type: string
          format: email
        rollNumber:
          type: string
          nullable: true
        next:
          type: string
          description: Suggested next client path after signup
          example: /signup/onboarding

    SignupSuccessResponse:
      type: object
      required:
        - success
        - data
      properties:
        success:
          type: boolean
          enum:
            - true
        data:
          $ref: "#/components/schemas/SignupUser"
        userStory:
          type: string
          description: Mapped user story id from docs/user_stories.md
          example: "1.1"

    ErrorDetail:
      type: object
      properties:
        path:
          type: string
          example: email
        message:
          type: string
          example: Email must end with @ds.study.iitm.ac.in

    ApiError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Machine-readable error code
          enum:
            - INVALID_JSON
            - VALIDATION_ERROR
            - EMAIL_EXISTS
            - ROLL_EXISTS
            - INVALID_CREDENTIALS
            - UNAUTHENTICATED
            - FORBIDDEN
            - CLUB_NOT_FOUND
            - ALREADY_MEMBER
            - MEMBERSHIP_NOT_FOUND
            - EVENT_NOT_FOUND
            - REGISTRATION_LOCKED
            - REGISTRATION_UNAVAILABLE
            - REGISTRATION_NOT_FOUND
            - CONFIRMATION_REQUIRED
            - INTERNAL_ERROR
        message:
          type: string
          description: Human-readable error message
        details:
          type: array
          description: Optional field-level validation details (Zod)
          items:
            $ref: "#/components/schemas/ErrorDetail"

    ErrorResponse:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: "#/components/schemas/ApiError"
        userStory:
          type: string
          description: Mapped user story id from docs/user_stories.md
          example: "1.1"

    MockAuthResponse:
      type: object
      required:
        - mode
        - message
      properties:
        mode:
          type: string
          enum:
            - mock
        message:
          type: string

    OnboardingInterestsRequest:
      type: object
      required:
        - interests
      properties:
        interests:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
            enum: [Technical, Cultural, Sports, Design, Debate, Entrepreneurship, Sustainability, Writing]

    BulkImportRequest:
      type: object
      required:
        - clubId
        - rows
      properties:
        clubId:
          type: string
        rows:
          type: array
          minItems: 1
          items:
            type: object
            required: [name, roll, email]
            properties:
              name: { type: string }
              roll: { type: string }
              email:
                type: string
                format: email
                description: Institutional email only. Must end with @ds.study.iitm.ac.in.
                pattern: "^[^@\\s]+@ds\\.study\\.iitm\\.ac\\.in$"
              role:
                type: string
                enum: [Member, Volunteer, Coordinator, Admin]

    MembershipRecord:
      type: object
      properties:
        id: { type: string }
        userId: { type: string }
        name: { type: string }
        email: { type: string, format: email }
        rollNumber: { type: string, nullable: true }
        clubId: { type: string }
        role:
          type: string
          enum: [Member, Volunteer, Coordinator, Admin]
        status:
          type: string
          enum: [Active, Pending, Inactive]
        joinedAt: { type: string, format: date-time }

    CreateEventRequest:
      type: object
      required:
        - clubId
        - title
        - description
        - date
        - time
        - venue
        - capacity
      properties:
        clubId: { type: string }
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        date: { type: string, format: date }
        time: { type: string, example: "18:00" }
        venue: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }
        tags:
          type: string
          description: Comma-separated tags
          example: "workshop,beginner-friendly"

    UpdateEventRequest:
      type: object
      description: All fields optional — only supplied fields are updated.
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string, minLength: 1 }
        date: { type: string, format: date }
        time: { type: string }
        venue: { type: string, minLength: 1 }
        capacity: { type: integer, minimum: 1 }
        tags:
          type: string
          description: Comma-separated tags

    EventRecord:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        clubId: { type: string }
        date: { type: string, format: date-time }
        time: { type: string }
        venue: { type: string }
        status:
          type: string
          enum: [upcoming, live, past]
        capacity: { type: integer }
        going: { type: integer }
        tags:
          type: array
          items: { type: string }
        description: { type: string }
        approval:
          type: string
          enum: [approved, pending, notRequired, rejected]
        registrationLocked: { type: boolean }